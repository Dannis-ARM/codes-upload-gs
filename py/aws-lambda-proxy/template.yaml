AWSTemplateFormatVersion: '2010-09-09'
Description: "Deploys a strictly PRIVATE REST API Gateway behind a VPC Endpoint."

Parameters:
  LambdaFunctionName:
    Type: String
    Default: 'ActionHandlerLambda'
  UpdateWorkerLambdaArn:
    Type: String
  FetchWorkerLambdaArn:
    Type: String
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  # 1. VPC Endpoint - 私有 API 的入口
  ApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.execute-api'
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SecurityGroupId
      PrivateDnsEnabled: true

  # 2. PRIVATE REST API
  PrivateRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${LambdaFunctionName}-PrivateApi'
      EndpointConfiguration:
        Types:
          - PRIVATE
        VpcEndpointIds:
          - !Ref ApiVpcEndpoint
      # 私有 API 必须设置资源策略，否则所有请求都会被拒绝
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "execute-api:Invoke"
            Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*/*"
            Condition:
              StringEquals:
                aws:SourceVpce: !Ref ApiVpcEndpoint

  # 3. API 资源与方法 (等同于之前的路径配置)
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PrivateRestApi
      ParentId: !GetAtt PrivateRestApi.RootResourceId
      PathPart: "action" # 访问路径将变为 /action

  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PrivateRestApi
      ResourceId: !Ref ApiResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM # 保持 IAM 认证
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ActionHandlerLambda.Arn}/invocations"

  # 4. 部署与阶段
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiMethod
    Properties:
      RestApiId: !Ref PrivateRestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PrivateRestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  # ----------------------------------------------------------------
  # Lambda 权限 (更新为支持 REST API)
  # ----------------------------------------------------------------
  LambdaApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ActionHandlerLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateRestApi}/*'

  # ----------------------------------------------------------------
  # 以下保持你原有的 Lambda 和 Role 定义，但 ARN 修正
  # ----------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${LambdaFunctionName}-ExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: 'InvokeWorkerLambdasPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource:
                  - !Ref UpdateWorkerLambdaArn
                  - !Ref FetchWorkerLambdaArn

  ActionHandlerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: main.lambda_handler
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds: [!Ref SecurityGroupId]
        SubnetIds: !Ref SubnetIds
      Architectures: [arm64]

Outputs:
  ApiEndpoint:
    Description: "Private API Endpoint"
    # 私有 API 格式示例: https://{restapi-id}-{vpce-id}.execute-api.{region}.amazonaws.com/prod
    Value: !Sub "https://${PrivateRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/action"