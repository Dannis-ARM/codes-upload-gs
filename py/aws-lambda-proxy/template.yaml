# <#noparse>
AWSTemplateFormatVersion: '2010-09-09'
Description: "Multi-Region Private REST API Gateway with IAM Authentication and Registry-CLI path."

Parameters:
  LambdaFunctionName:
    Type: String
    Default: 'ProxyLambda'
  AuthorizerLambdaFunctionName:
    Type: String
    Default: 'ProxyLambdaAuthorizer'
  UpdateWorkerLambdaArn:
    Type: String
  FetchWorkerLambdaArn:
    Type: String
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  # ----------------------------------------------------------------
  # 1. VPC ENDPOINT
  # ----------------------------------------------------------------
  ApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.execute-api'
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SecurityGroupId
      PrivateDnsEnabled: true

  # ----------------------------------------------------------------
  # 2. PRIVATE REST API & AUTHORIZER
  # ----------------------------------------------------------------
  PrivateRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${LambdaFunctionName}-PrivateApi'
      EndpointConfiguration:
        Types: [PRIVATE]
        VpcEndpointIds: [!Ref ApiVpcEndpoint]
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "execute-api:Invoke"
            Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*/*"
            Condition:
              StringEquals:
                aws:SourceVpce: !Ref ApiVpcEndpoint

  LambdaAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: 'LambdaAuthorizer'
      RestApiId: !Ref PrivateRestApi
      Type: REQUEST
      AuthorizerUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambda.Arn}/invocations"
      # The client must include a header 'x-caller-role-name' with their role (e.g., 'UpdateRole')
      IdentitySource: 'method.request.header.x-caller-role-name'
      # Optionally, cache the authorizer response for 5 minutes (300 seconds)
      # AuthorizerResultTtlInSeconds: 300

  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PrivateRestApi
      ParentId: !GetAtt PrivateRestApi.RootResourceId
      PathPart: "registry-cli"

  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PrivateRestApi
      ResourceId: !Ref ApiResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProxyLambda.Arn}/invocations"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiMethod
    Properties:
      RestApiId: !Ref PrivateRestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PrivateRestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  # ----------------------------------------------------------------
  # 3. LAMBDA FUNCTIONS & PERMISSIONS
  # ----------------------------------------------------------------

  # Integration Lambda (Business Logic)
  ProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: proxy.lambda_handler # Explicitly set handler
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds: [!Ref SecurityGroupId]
        SubnetIds: !Ref SubnetIds
      Architectures: [arm64]

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  LambdaApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ProxyLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateRestApi}/*'

  # Authorizer Lambda
  AuthorizerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref AuthorizerLambdaFunctionName
      Runtime: python3.11
      Role: !GetAtt AuthorizerLambdaExecutionRole.Arn
      Handler: authorizer.authorizer_handler # Points to the new authorizer code
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Architectures: [arm64]

  AuthorizerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  AuthorizerLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AuthorizerLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateRestApi}/authorizers/*'

Outputs:
  ApiEndpoint:
    Description: "The private API Gateway endpoint URL"
    Value: !Sub 
      - "https://${PrivateRestApi}.execute-api.${AWS::Region}.${Suffix}/prod/registry-cli"
      - Suffix: !If [IsChina, "amazonaws.com.cn", "amazonaws.com"]

  # ----------------------------------------------------------------
  # 4. CALLER IAM ROLES (FOR IDENTITY)
  # Roles assumed by clients to establish an identity.
  # The role name is passed in the 'x-caller-role-name' header to the API.
  # These roles no longer need execute-api:Invoke permissions directly.
  # ----------------------------------------------------------------
  ReadWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'ReadWriteRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' # Principals who can assume this role should be restricted
            Action: 'sts:AssumeRole'

  ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'ReadOnlyRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' # Principals who can assume this role should be restricted
            Action: 'sts:AssumeRole'

Conditions:
  IsChina: !Equals [!Ref "AWS::Partition", "aws-cn"]
# </#noparse>