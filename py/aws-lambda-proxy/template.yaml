AWSTemplateFormatVersion: '2010-09-09'
Description: "Multi-Region Private REST API Gateway with IAM Authentication and Registry-CLI path."

Parameters:
  LambdaFunctionName:
    Type: String
    Default: 'ProxyLambda'
  UpdateWorkerLambdaArn:
    Type: String
  FetchWorkerLambdaArn:
    Type: String
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  # ----------------------------------------------------------------
  # 1. VPC ENDPOINT
  # Provides private connectivity to the API Gateway service
  # ----------------------------------------------------------------
  ApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.execute-api'
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SecurityGroupId
      PrivateDnsEnabled: true

  # ----------------------------------------------------------------
  # 2. PRIVATE REST API
  # Configured as PRIVATE type to restrict access to the VPC Endpoint
  # ----------------------------------------------------------------
  PrivateRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${LambdaFunctionName}-PrivateApi'
      EndpointConfiguration:
        Types:
          - PRIVATE
        VpcEndpointIds:
          - !Ref ApiVpcEndpoint
      # Resource Policy: Allows invocation only via the specified VPC Endpoint
      Policy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "execute-api:Invoke"
            Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*/*"
            Condition:
              StringEquals:
                aws:SourceVpce: !Ref ApiVpcEndpoint

  # API Resource Path: /registry-cli
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PrivateRestApi
      ParentId: !GetAtt PrivateRestApi.RootResourceId
      PathPart: "registry-cli"

  # API Method: POST with IAM Authorization
  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PrivateRestApi
      ResourceId: !Ref ApiResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        # URI format for Lambda integration in REST API
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProxyLambda.Arn}/invocations"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiMethod
    Properties:
      RestApiId: !Ref PrivateRestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PrivateRestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  # ----------------------------------------------------------------
  # 3. LAMBDA FUNCTION & PERMISSIONS
  # ----------------------------------------------------------------
  ProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: main.lambda_handler
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds: [!Ref SecurityGroupId]
        SubnetIds: !Ref SubnetIds
      Architectures: [arm64]

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

  # Permission for API Gateway to trigger the Lambda
  LambdaApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProxyLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateRestApi}/*'

  # ----------------------------------------------------------------
  # 4. CALLER IAM ROLES
  # Roles used by clients to sign and send requests to the API
  # ----------------------------------------------------------------
  UpdateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'UpdateRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'InvokeApiGatewayPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'execute-api:Invoke'
                Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateRestApi}/prod/POST/registry-cli'

  FetchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'FetchRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'InvokeApiGatewayPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'execute-api:Invoke'
                Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PrivateRestApi}/prod/POST/registry-cli'

Outputs:
  ApiEndpoint:
    Description: "The private API Gateway endpoint URL"
    # Note: China region requires .com.cn, global uses .com
    Value: !Sub 
      - "https://${PrivateRestApi}.execute-api.${AWS::Region}.${Suffix}/prod/registry-cli"
      - Suffix: !If [IsChina, "amazonaws.com.cn", "amazonaws.com"]

Conditions:
  IsChina: !Equals [!Ref "AWS::Partition", "aws-cn"]