AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Deploys a secure Lambda proxy behind a private API Gateway. The proxy uses
  IAM to authorize and route requests from different roles (UpdateRole, FetchRole)
  to specific actions.

Parameters:
  LambdaFunctionName:
    Type: String
    Default: 'ActionHandlerLambda'
    Description: 'Name for the central handler Lambda function.'
  UpdateWorkerLambdaArn:
    Type: String
    Description: "The ARN of the pre-existing worker Lambda for updating records."
  FetchWorkerLambdaArn:
    Type: String
    Description: "The ARN of the pre-existing worker Lambda for fetching records."
  CodeS3Bucket:
    Type: String
    Description: "The S3 bucket containing the zipped Lambda code."
  CodeS3Key:
    Type: String
    Description: "The S3 key for the zipped Lambda code."
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "The ID of the VPC for the private API endpoint."
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "The Security Group ID for the Lambda function and VPC Endpoint."
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "A list of Subnet IDs for the Lambda function and VPC Endpoint."

Resources:
  # ----------------------------------------------------------------
  #   VPC ENDPOINT FOR PRIVATE API GATEWAY
  # ----------------------------------------------------------------
  ApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.execute-api'
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SecurityGroupId
      PrivateDnsEnabled: true

  # ----------------------------------------------------------------
  #   PRIVATE API GATEWAY
  # ----------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${LambdaFunctionName}-PrivateApi'
      ProtocolType: HTTP
      Body:
        info:
          title: !Ref AWS::StackName
          version: '1.0'
        paths:
          /:
            post:
              x-amazon-apigateway-integration:
                type: 'aws_proxy'
                httpMethod: 'POST'
                uri: !GetAtt ActionHandlerLambda.Arn
                payloadFormatVersion: '2.0'
              security:
                - IAM: []
        components:
          securitySchemes:
            IAM:
              type: 'aws_iam'
      EndpointConfiguration:
        Type: PRIVATE
      VpcEndpoints:
        - !Ref ApiVpcEndpoint

  # ----------------------------------------------------------------
  #   LAMBDA FUNCTION AND EXECUTION ROLE
  # ----------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${LambdaFunctionName}-ExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws-cn:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws-cn:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: 'InvokeWorkerLambdasPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource:
                  - !Ref UpdateWorkerLambdaArn
                  - !Ref FetchWorkerLambdaArn

  ActionHandlerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: main.lambda_handler
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      VpcConfig:
        SecurityGroupIds:
          - !Ref SecurityGroupId
        SubnetIds: !Ref SubnetIds
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          UPDATE_WORKER_LAMBDA_NAME: !Ref UpdateWorkerLambdaArn
          FETCH_WORKER_LAMBDA_NAME: !Ref FetchWorkerLambdaArn

  # Lambda Permission to be invoked by API Gateway
  LambdaApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ActionHandlerLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ----------------------------------------------------------------
  #   CALLER IAM ROLES (Clients)
  # ----------------------------------------------------------------
  UpdateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'UpdateRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws-cn:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'InvokeApiGatewayPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'execute-api:Invoke'
                Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  FetchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'FetchRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws-cn:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: 'InvokeApiGatewayPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'execute-api:Invoke'
                Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  ApiEndpoint:
    Description: "The private API Gateway endpoint URL"
    Value: !GetAtt HttpApi.ApiEndpoint
  UpdateRoleToAssume:
    Description: "ARN of UpdateRole to assume for testing."
    Value: !GetAtt UpdateRole.Arn
  FetchRoleToAssume:
    Description: "ARN of FetchRole to assume for testing."
    Value: !GetAtt FetchRole.Arn