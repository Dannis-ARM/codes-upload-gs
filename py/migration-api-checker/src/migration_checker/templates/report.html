<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migration API Check Report</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
        .summary { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
        .summary-card { padding: 16px 24px; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; transition: transform 0.1s, filter 0.1s; user-select: none; }
        .summary-card:hover:not(.duration) { transform: scale(1.02); }
        .summary-card:active:not(.duration) { transform: scale(0.98); }
        .summary-card.total { background: #6366f1; }
        .summary-card.passed { background: #10b981; }
        .summary-card.failed { background: #ef4444; }
        .summary-card.duration { background: #8b5cf6; cursor: default; }
        .summary-card.active { filter: brightness(0.85); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .filter-indicator { color: #666; font-size: 14px; margin-bottom: 20px; min-height: 20px; }
        .filter-indicator span { font-weight: 600; color: #333; }
        .meta { color: #666; font-size: 14px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; font-weight: 600; color: #374151; position: sticky; top: 0; }
        .pass { background: #ecfdf5; }
        .fail { background: #fef2f2; }
        tr.hidden { display: none; }
        .status-cell { font-weight: 600; }
        .name-cell { font-weight: 500; max-width: 300px; }
        .name-cell .toggle-btn { width: 100%; display: inline-block; vertical-align: bottom; }
        .name-cell .toggle-btn.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .name-cell .name-text { display: inline-block; }
        .name-cell .name-text.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
        .url-cell { font-family: monospace; font-size: 12px; max-width: 350px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .url-cell .label { color: #666; font-weight: 600; }
        .url-cell a { color: #3b82f6; text-decoration: none; }
        .url-cell a:hover { text-decoration: underline; }
        .status-code { font-family: monospace; text-align: center; }
        .time { font-family: monospace; text-align: right; }
        .toggle-btn { background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 500; text-align: left; padding: 0; color: #3b82f6; }
        .toggle-btn:hover { text-decoration: underline; }
        .name-text { font-size: 14px; font-weight: 500; color: #374151; }
        .details-row { display: none; }
        .details-row.show { display: table-row; }
        .details-content { padding: 16px; background: #1f2937; border-radius: 8px; margin: 8px 0; }
        .section-title { color: #fbbf24; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .error-section pre { color: #fca5a5; background: #450a0a; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 12px; line-height: 1.5; }
        .diff-section .diff-line { padding: 2px 8px; font-family: monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
        .diff-line.added { background: #064e3b; color: #6ee7b7; }
        .diff-line.removed { background: #450a0a; color: #fca5a5; }
        .diff-line.changed { background: #431407; color: #fdba74; }
        .diff-line.normal { color: #e5e7eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Migration API Check Report</h1>
        <div class="meta">$meta</div>
        <div class="summary">$summary</div>
        <div class="filter-indicator"></div>
        <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Test Name</th>
                    <th>Before URL</th>
                    <th>After URL</th>
                    <th>Before Status</th>
                    <th>After Status</th>
                    <th>Before Time</th>
                    <th>After Time</th>
                </tr>
            </thead>
            <tbody>$test_rows</tbody>
        </table>
    </div>
    <script>
        let currentFilter = 'all';

        function toggleDetails(id) {
            const row = document.getElementById(id);
            row.classList.toggle('show');
        }

        function setFilter(filter) {
            const cards = document.querySelectorAll('.summary-card[data-filter]');
            const rows = document.querySelectorAll('tbody tr[data-status]');
            const indicator = document.querySelector('.filter-indicator');

            // Toggle: if clicking the same filter, clear it
            if (currentFilter === filter) {
                currentFilter = 'all';
            } else {
                currentFilter = filter;
            }

            // Update card active states
            cards.forEach(card => {
                const cardFilter = card.getAttribute('data-filter');
                if (cardFilter === currentFilter) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            // Update row visibility
            rows.forEach(row => {
                const status = row.getAttribute('data-status');
                const detailsRow = row.nextElementSibling;
                if (currentFilter === 'all' || status === currentFilter) {
                    row.classList.remove('hidden');
                    // Don't touch details-row show state - let toggleDetails handle it
                } else {
                    row.classList.add('hidden');
                    // Also hide details row if main row is hidden
                    if (detailsRow && detailsRow.classList.contains('details-row')) {
                        detailsRow.classList.remove('show');
                    }
                }
            });

            // Update indicator
            const filterLabels = {
                'all': 'All tests',
                'pass': 'Passed tests',
                'fail': 'Failed tests'
            };
            if (currentFilter === 'all') {
                indicator.textContent = '';
            } else {
                indicator.innerHTML = 'Showing: <span>' + filterLabels[currentFilter] + '</span> (click the active card to show all)';
            }
        }

        // Initialize filter click handlers
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.summary-card[data-filter]');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const filter = card.getAttribute('data-filter');
                    setFilter(filter);
                });
            });
        });
    </script>
</body>
</html>
